name: CI and manual deploy
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      stage:
        description: Deployment stage
        type: choice
        required: true
        options: [dev, prod]
      deployEndpoint:
        description: Explicitly enable real-time endpoint flow (ongoing charges)
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install
      - run: npm run lint
      - run: npm test
      - run: python -m pip install pytest boto3
      - run: python -m pytest tests/test_ml.py -x -q
      - run: npm run synth -- -c stage=dev

  deploy:
    if: github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-latest
    environment: ${{ inputs.stage }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
      - run: npx cdk deploy DemandForecastMlops-${{ inputs.stage }} -c stage=${{ inputs.stage }} -c deployEndpoint=${{ inputs.deployEndpoint }} --parameters XgboostImageUri=${{ vars.XGBOOST_IMAGE_URI }} --require-approval never
